schema = 1

[runtimes]
go_version = "1.26.5"
bash_version = "5.3.15"
bash_image = "docker.io/library/bash:5.3.15-alpine3.24@sha256:a19c811ee9e97fa8a080001d82b8e0ded303f0795cffdb1cbd162731bc8ce208"

# `default_check = true` 只用于无需外部服务、无需公网目标且应长期通过的模块。
# checks 采用 argv 数组，仓库检查器不会经过 shell 解释这些值。

[[modules]]
id = "learning-go"
path = "learning/go"
kind = "learning"
status = "active"
summary = "Go 语言、后端工程与固定开源案例课程"

[[modules]]
id = "learning-bash"
path = "learning/bash"
kind = "learning"
status = "active"
summary = "Bash 自动化与部署脚本课程"
checks = [["python", "{root}/tools/repo-manager/bash_course.py"]]

[[modules]]
id = "package-python-algorithms"
path = "packages/python-algorithms"
kind = "package"
status = "stable"
summary = "用于算法复习和题解原型的可安装 Python 软件包"
default_check = true
checks = [
  ["uv", "run", "--frozen", "pytest"],
  ["uv", "run", "--frozen", "ruff", "check", "."],
  ["uv", "build", "--out-dir", "{scratch}/dist/python-algorithms"],
]

[[modules]]
id = "lab-cpp-implementations"
path = "labs/algorithms/cpp-implementations"
kind = "lab"
status = "incomplete"
summary = "尚未形成公开 CMake package 的 C++ 算法与数据结构实现"
checks = [
  ["cmake", "-S", ".", "-B", "{scratch}/build/lab-cpp-implementations", "-G", "Ninja"],
  ["cmake", "--build", "{scratch}/build/lab-cpp-implementations"],
]

[[modules]]
id = "lab-python-implementations"
path = "labs/algorithms/python-implementations"
kind = "lab"
status = "incomplete"
summary = "尚未形成稳定公开接口的 Python 算法与竞赛实现"
checks = [
  ["uv", "run", "--frozen", "pytest"],
  ["uv", "run", "--frozen", "python", "-m", "compileall", "-q", "algorithms", "competitive-programming", "data-structures"],
]

[[modules]]
id = "lab-go-fundamentals"
path = "labs/languages/go-fundamentals"
kind = "lab"
status = "incomplete"
summary = "独立运行的 Go 语言与并发机制实验"
checks = [
  ["go", "test", "./..."],
  ["go", "vet", "./..."],
]

[[modules]]
id = "lab-java-runtime"
path = "labs/languages/java-runtime"
kind = "lab"
status = "incomplete"
summary = "Java 集合、并发、代理与类加载机制实验"
checks = [["mvn", "-q", "test"]]

[[modules]]
id = "lab-python-runtime"
path = "labs/languages/python-runtime"
kind = "lab"
status = "incomplete"
summary = "Python 语言、标准库与 mock 测试机制实验"
checks = [
  ["uv", "run", "--frozen", "pytest"],
  ["uv", "run", "--frozen", "python", "-m", "compileall", "-q", "language", "standard-library", "testing"],
]

[[modules]]
id = "problems-leetcode"
path = "problems/leetcode"
kind = "problems"
status = "active"
summary = "由 leetgo 管理的 OJ 尝试；允许未完成题解"

[[modules]]
id = "problems-acwing"
path = "problems/acwing"
kind = "problems"
status = "legacy"
summary = "按 AcWing 题目标识符保存的历史题解"

[[modules]]
