[[modules]]
id = "tool-process-inspector"
path = "tools/process-inspector"
kind = "tool"
status = "stable"
summary = "按命令行关键字查询进程和线程数"
default_check = true
checks = [
  ["uv", "run", "--frozen", "pytest"],
  ["uv", "run", "--frozen", "ruff", "check", "."],
  ["bash", "-n", "scripts/thread-count.sh"],
]

[[modules]]
id = "tool-repo-manager"
path = "tools/repo-manager"
kind = "tool"
status = "stable"
summary = "列出模块、诊断开发环境并运行模块检查"
default_check = true
checks = [["python", "-m", "unittest", "discover", "-s", "tests"]]

