[project]
name = "algorithm-copypasta-python"
version = "0.1.0"
description = "竞赛算法手册中的 Python 实现与行为测试"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]
ignore = ["E501", "F403", "F405", "RUF001", "RUF002", "RUF003"]
