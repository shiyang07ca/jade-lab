[project]
name = "python-observability-lab"
version = "0.1.0"
description = "Python OpenTelemetry 与 Prometheus 实验"
requires-python = ">=3.12,<3.15"
dependencies = [
    "opentelemetry-sdk>=1.27,<2",
    "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.15,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
