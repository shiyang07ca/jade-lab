[project]
name = "numpy-lab"
version = "0.1.0"
description = "NumPy 数值计算实验"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.15,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
