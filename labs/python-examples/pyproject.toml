[project]
name = "python-examples"
version = "0.1.0"
description = "Python 语言、标准库与测试机制实验"
requires-python = ">=3.12,<3.15"
dependencies = [
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["testing/mocking"]
pythonpath = ["testing/mocking"]
addopts = ["--strict-config", "--strict-markers"]
