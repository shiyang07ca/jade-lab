[project]
name = "python-algorithm-implementation-lab"
version = "0.1.0"
description = "尚未形成稳定公开接口的 Python 算法实现实验"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers"]
