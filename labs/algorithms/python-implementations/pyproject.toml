[project]
name = "python-algorithm-implementation-lab"
version = "0.1.0"
description = "尚未形成稳定公开接口的 Python 算法实现实验"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jade-algorithms",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.uv.sources]
jade-algorithms = { path = "../../../packages/python-algorithms", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
